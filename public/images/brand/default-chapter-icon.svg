<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Background -->
  <rect width="120" height="120" fill="#0C0D10"/>
  <rect x="0.5" y="0.5" width="119" height="119" stroke="#26272B" stroke-width="1"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M0 60h120M60 0v120" stroke="#1B1C22" stroke-width="0.75" stroke-dasharray="3 3"/>
  <circle cx="60" cy="60" r="38" stroke="#22232A" stroke-width="1"/>
  <circle cx="60" cy="60" r="26" stroke="#990000" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Stylized Robotic Arm / Automation Emblem (IEEE RAS) -->
  <g transform="translate(60, 52)">
    <!-- Base -->
    <path d="M-14 16h28v3h-28z" fill="#71717A"/>
    <path d="M-9 16l4-8h10l4 8z" fill="#990000"/>
    
    <!-- Joint 1 -->
    <circle cx="0" cy="8" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="8" r="2" fill="#0C0D10"/>
    
    <!-- Link 1 -->
    <path d="M-2 8l-6-16h4l6 16z" fill="#E4E4E7"/>
    
    <!-- Joint 2 -->
    <circle cx="-5" cy="-8" r="3.5" fill="#990000"/>
    <circle cx="-5" cy="-8" r="1.5" fill="#FFFFFF"/>
    
    <!-- Link 2 -->
    <path d="M-5 -8l16-6 1 3.5-16 6z" fill="#E4E4E7"/>
    
    <!-- End Effector / Gripper -->
    <circle cx="11" cy="-14" r="3" fill="#FFFFFF"/>
    <path d="M12 -17l6 -2M12 -11l6 2M18 -19l2 2M18 -9l2 -2" stroke="#990000" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Signal waves -->
    <path d="M16 -14a6 6 0 0 1 0 0" stroke="#990000" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Label -->
  <text x="60" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#E4E4E7">IEEE RAS</text>
  <text x="60" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="6" font-weight="600" letter-spacing="2" fill="#71717A">CHAPTER</text>
</svg>

